# WatchPath on GCP
# Deploy: docker compose -f docker-compose.gcp.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchpath
      POSTGRES_PASSWORD: watchpath
      POSTGRES_DB: watchpath
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U watchpath -d watchpath']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - watchpath-db:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env.gcp
    ports:
      - '9000:9000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file: .env.gcp
    ports:
      - '4000:4000'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  watchpath-db:
