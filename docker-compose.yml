services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchpath
      POSTGRES_PASSWORD: watchpath
      POSTGRES_DB: watchpath
    # Host 5433 avoids conflict when another Postgres already uses 5432 on the machine
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U watchpath -d watchpath']
      interval: 5s
      timeout: 5s
      retries: 5
